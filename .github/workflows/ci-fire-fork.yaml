name: FIRE fork native acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/ts-pack-core/**'
      - 'crates/ts-pack-index/**'
      - 'crates/ts-pack-python/**'
      - 'tests/fire/**'
      - '.github/workflows/ci-fire-fork.yaml'
permissions:
  contents: read
jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TSLP_OFFLINE: '1'
      CARGO_PROFILE_RELEASE_STRIP: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - run: python -m pip wheel --no-cache-dir --no-deps --wheel-dir artifacts ./crates/ts-pack-python
      - shell: bash
        run: python -m pip install artifacts/*.whl
      - run: python tests/fire/test_project_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: fire-fork-${{ matrix.os }}
          path: artifacts/*.whl
